# Genesis allocation
alloc_summary:
  precompile_placeholders: 256          # 0x00..0x00 through 0x00..0xff, 1 wei each
  funded:
    - address: 0x131b395794e487b564fd86f5872727fc44544d23
      balance_wei: 1000000000000000000000000000  # 1,000,000,000 GTH

# Provenance
# ---------------------------------------------------------------
# Unlike joc and joct, no official genesis.json for sandbox1 was available, so
# this one is reconstructed:
#
#   * Every header field is copied verbatim from the live block 0.
#   * The 256 placeholder accounts were each confirmed at 1 wei via
#     eth_getBalance at block 0 (and 0x01_00 confirmed absent).
#   * The funded account was traced from the chain's earliest transfers and
#     confirmed to hold exactly 1e27 wei at block 0.
#
# `geth init` reproducing genesis_hash proves the allocation and every header
# field are exactly right — the state root commits to the full allocation. CI
# runs that check, so this file is not taken on trust.
#
# What the genesis hash does NOT cover is the `config` block: fork activation
# blocks and clique.epoch do not enter the hash. Entries marked INFERRED above
# follow the convention joc and joct use and are NOT verified. Replace them from
# the authoritative genesis.json when it is available.
